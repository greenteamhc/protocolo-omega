<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PROTOCOLO ÔMEGA // TRANSMISSÃO 01</title>

    <style>
        body {
            margin: 0;
            background: #080b0a;
            color: #d9ffe9;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .terminal {
            width: 90%;
            max-width: 650px;
            border: 1px solid #3aff88;
            padding: 30px;
            box-shadow: 0 0 25px rgba(58, 255, 136, 0.15);
        }

        h1 {
            color: #3aff88;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .warning {
            color: #aaa;
            margin-bottom: 30px;
        }

        .info {
            line-height: 1.8;
            margin-bottom: 30px;
        }

        audio {
            width: 100%;
        }

        .footer {
            margin-top: 25px;
            color: #666;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="terminal">

        <h1>PROTOCOLO ÔMEGA</h1>

        <div class="warning">
            // TRANSMISSÃO 01 — RECEPÇÃO INSTÁVEL
        </div>

        <div class="info">
            ORIGEM: DESCONHECIDA<br>
            STATUS: CORROMPIDO<br>
            DURAÇÃO: 00:37<br>
            NÍVEL DE RUÍDO: 97%
        </div>

        <p>
            "O que foi apagado da mensagem ainda ocupa espaço."
        </p>

        <br>

        <audio controls>
            <source src="transmissao_01_sinal_fantasma_v2.wav" type="audio/wav">

        </audio>

        <div class="footer">
            Ω—01 // GTHC // ARQUIVO RECUPERADO
        </div>

    </div>

</body>

</html>
